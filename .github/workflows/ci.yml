name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Bumped 2026-08-22 from checkout@v4 / setup-python@v5, which run on Node 20. GitHub has
      # deprecated that runtime and was already forcing these steps onto Node 24 with a warning
      # on every run; the v5/v6 majors target Node 24 natively. Behaviour is otherwise identical,
      # including `cache: pip`.
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + model + dev)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps CI fast; rdkit is intentionally omitted (hashed-
          # fingerprint fallback), so the full suite runs without heavy bio deps.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # plan_tests/ added 2026-08-01: these are the per-stage verification gates, and while
        # they sat at the repo root they were never linted. Two pre-existing errors surfaced the
        # moment they came into scope, and both are fixed. experiments/ is deliberately still
        # OUT of scope -- it carries 12 pre-existing errors in older exploratory scripts, and
        # bringing it in is its own change with its own diff, not a side effect of a tidy-up.
        run: ruff check src/ tests/ scripts/ plan_tests/

      # Added 2026-08-28. The three Generation-1 locks are the project's central claim, and until
      # now nothing checked them on a clean checkout -- so a locked file edited after its lock was
      # computed shipped green. That happened: a record was amended after the evidence lock ran,
      # and only a manual --verify caught it. The gitignored 44 MB artifact is absent here by
      # design and is reported, not counted as a failure; a content change to anything still fails.
      - name: Verify the Generation-1 locks
        run: |
          python experiments/run_gen1_evidence_lock.py --verify
          python experiments/run_gen1_claim_lock.py --verify
          python experiments/run_gen1_manuscript.py --verify

      # Snapshotted BEFORE the suite rather than compared against a clean tree, so a line-ending
      # or checkout quirk cannot fail this step. Only changes the suite itself made will differ.
      - name: Snapshot the working tree
        run: git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-before.txt"

      - name: Test (pytest)
        run: pytest -q

      # Added 2026-08-28 after a close-out pass found a manuscript contract that proved its point
      # by running the negative controls -- which wrote results/manuscript/manuscript_controls.json
      # with a fresh runtime_seconds, so `pytest` left the tree dirty on every run. Nothing was
      # wrong with the checks, but a test that modifies a committed artifact is a side effect, not
      # a check, and the same thing must not come back quietly.
      - name: The suite must not modify the working tree
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/tree-after.txt"
          if ! diff -u "$RUNNER_TEMP/tree-before.txt" "$RUNNER_TEMP/tree-after.txt"; then
            echo "::error::pytest changed the working tree. A test that writes a committed artifact is a side effect, not a check. The status diff is above; the content diff follows."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "the suite left the working tree unchanged"
