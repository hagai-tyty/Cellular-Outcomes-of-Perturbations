<text x="24.0" y="168.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Outcome C1  post-treatment clone DETECTION — an observed zero means no assigned cell was seen.</text>
<text x="24.0" y="184.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10.5" fill="#a33b20" text-anchor="start" font-weight="normal" font-style="italic">Not death, not sensitivity, not clinical response.</text>
